name: Platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test portable core (no hardware)
        run: dotnet test tests/CellPort.Core.Tests/CellPort.Core.Tests.csproj -c Release --nologo
      - name: Build unified solution
        run: dotnet build CellPort.slnx -c Release -p:EnableWindowsTargeting=true --nologo
      - name: Test headless app workflows
        run: dotnet test tests/CellPort.App.Tests/CellPort.App.Tests.csproj -c Release --nologo
      - name: Test portable audio contracts (no hardware)
        run: dotnet test tests/CellPort.Audio.Core.Tests/CellPort.Audio.Core.Tests.csproj -c Release --nologo
      - name: Test Linux USB identity and selectors (synthetic sysfs, no hardware)
        run: dotnet test tests/CellPort.Platform.Linux.Tests/CellPort.Platform.Linux.Tests.csproj -c Release --nologo
      - name: Build portable audio contracts
        run: dotnet build src/CellPort.Audio.Core/CellPort.Audio.Core.csproj -c Release --nologo
      - name: Build Linux platform adapter
        run: dotnet build src/CellPort.Platform.Linux/CellPort.Platform.Linux.csproj -c Release --nologo
      - name: Build portable serial transport
        run: dotnet build src/CellPort.Transport.Serial/CellPort.Transport.Serial.csproj -c Release --nologo
      - name: Test macOS serial discovery (no hardware)
        run: dotnet test tests/CellPort.Platform.MacOS.Tests/CellPort.Platform.MacOS.Tests.csproj -c Release --nologo

  macos-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build macOS host and adapter
        run: dotnet build CellPort.slnx -c Release -p:EnableWindowsTargeting=true --nologo
      - name: Install libusb
        run: |
          if [[ "$(uname -m)" == arm64 && -x /opt/homebrew/bin/brew ]]; then
            brew_bin=/opt/homebrew/bin/brew
          elif [[ "$(uname -m)" == x86_64 && -x /usr/local/bin/brew ]]; then
            brew_bin=/usr/local/bin/brew
          else
            brew_bin="$(command -v brew)"
          fi
          echo "$(dirname "$brew_bin")" >> "$GITHUB_PATH"
          "$brew_bin" install libusb
      - name: Package self-contained app
        run: bash scripts/publish-mac.sh
      - name: Cross-publish canonical Windows app
        run: dotnet publish src/CellPort.App/CellPort.App.csproj -c Release -r win-x64 --self-contained false -p:EnableWindowsTargeting=true -o dist/platform-check/windows-framework --nologo
      - name: Archive app preserving executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/osx-*/CellPort.app dist/CellPort-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CellPort-macos
          path: dist/CellPort-macos.zip

  windows-hosts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows hosts, tools, and diagnostics
        run: dotnet build CellPort.slnx -c Release --nologo
      - name: Publish framework-dependent
        run: dotnet publish src/CellPort.App/CellPort.App.csproj -c Release -r win-x64 --self-contained false -o dist/platform-check/framework-dependent
      - name: Publish self-contained
        run: dotnet publish src/CellPort.App/CellPort.App.csproj -c Release -r win-x64 --self-contained true -o dist/platform-check/self-contained
      - name: Verify platform assemblies are packaged
        shell: pwsh
        run: |
          foreach ($flavor in @('framework-dependent', 'self-contained')) {
            foreach ($assembly in @('CellPort.Core.dll', 'CellPort.Audio.Core.dll', 'CellPort.Platform.Windows.dll', 'CellPort.Transport.Serial.dll')) {
              if (!(Test-Path "dist/platform-check/$flavor/$assembly")) {
                throw "Missing $assembly in $flavor"
              }
            }
          }
